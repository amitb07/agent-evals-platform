name: agent-evals

# DATA_DIR is bind-mounted at the same absolute path as on the host: Harbor, running in the
# worker, bind-mounts trial dirs through the host Docker socket, so host and container paths
# must agree. EVALS_DATA_DIR (absolute) overrides the default, e.g. for the e2e test.
x-app-env: &app-env
  DATABASE_URL: postgresql://evals:evals@postgres:5432/evals
  DATA_DIR: ${EVALS_DATA_DIR:-${PWD}/data}
  REPO_DIR: /repo

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: evals
      POSTGRES_PASSWORD: evals
      POSTGRES_DB: evals
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U evals]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    build: { <<: *app-build, target: migrate }
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: { <<: *app-build, target: api }
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - ${EVALS_DATA_DIR:-${PWD}/data}:${EVALS_DATA_DIR:-${PWD}/data}
      - .:/repo:ro
    ports:
      - 3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Build-only services: they tag the agent and verifier images Harbor runs per trial, then exit.
  # `docker compose up` therefore builds everything a real run needs.
  hermes-image:
    build: { context: docker/hermes }
    image: evals/hermes-runner:latest
    entrypoint: ['true']
    restart: 'no'

  verifier-image:
    build: { <<: *app-build, target: verifier }
    image: evals/verifier:latest
    entrypoint: ['true']
    restart: 'no'

  worker:
    build: { <<: *app-build, target: worker }
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      HERMES_IMAGE: ${HERMES_IMAGE:-evals/hermes-runner:latest}
      VERIFIER_IMAGE: ${VERIFIER_IMAGE:-evals/verifier:latest}
    volumes:
      - ${EVALS_DATA_DIR:-${PWD}/data}:${EVALS_DATA_DIR:-${PWD}/data}
      - .:/repo:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      hermes-image:
        condition: service_completed_successfully
      verifier-image:
        condition: service_completed_successfully

  web:
    build: { <<: *app-build, target: web }
    ports:
      - 8080:8080
    depends_on:
      - api

volumes:
  pgdata:
