schema_version = "1.3"
artifacts = ["/app", "/logs/agent/trajectory.json"]

[task]
name = "evals/smoke"

[metadata]
category = "tools"

[environment]
cpus = 2
memory_mb = 2048
workdir = "/app"
network_mode = "no-network"

[agent]
timeout_sec = 300
user = "hermes"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[verifier]
environment_mode = "separate"
timeout_sec = 60

[verifier.environment]
cpus = 1
memory_mb = 512
network_mode = "no-network"
