job_name: spike-memory
n_attempts: 1
n_concurrent_trials: 1
environment:
  type: docker
  cpu_enforcement_policy: limit
  memory_enforcement_policy: limit
datasets:
  - path: spike/tasks
agents:
  - import_path: hermes_harbor.hermes_agent:HermesAgent
    model_name: anthropic/claude-sonnet-5
    kwargs:
      arm: M
      home_bundle: spike/bundles/seeded-memory
      toolsets: terminal,file,memory
      max_turns: 20
