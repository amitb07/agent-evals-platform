job_name: spike-smoke
n_attempts: 1
n_concurrent_trials: 2
retry:
  max_retries: 1
environment:
  type: docker
  cpu_enforcement_policy: limit
  memory_enforcement_policy: limit
datasets:
  - path: spike/tasks
agents:
  - import_path: hermes_harbor.hermes_agent:HermesAgent
    model_name: anthropic/claude-sonnet-5
    kwargs:
      arm: A
      home_bundle: spike/bundles/no-skill
      toolsets: terminal,file
      max_turns: 20
  - import_path: hermes_harbor.hermes_agent:HermesAgent
    model_name: anthropic/claude-sonnet-5
    kwargs:
      arm: B
      home_bundle: spike/bundles/with-skill
      toolsets: terminal,file
      skills: evals-marker
      max_turns: 20
